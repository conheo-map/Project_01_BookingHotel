=\&quot;10\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n\n        <!-- 7. CONTROL: D\u1ecaCH V\u1ee4 PH\u00c2N B\u1ed4 PH\u00d2NG (:RoomAllocationService) (X: 1040) -->\n        <mxCell id=\&quot;p_alloc_svc\&quot; value=\&quot;&lt;&lt;Control&gt;&gt;&#xa;:RoomAllocationService\&quot; style=\&quot;shape=umlControl;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#000000;strokeWidth=1.5;fontFamily=Arial;fontStyle=1;fontSize=11;fontColor=#000000;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;1015\&quot; y=\&quot;120\&quot; width=\&quot;65\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;ll_alloc_svc\&quot; value=\&quot;\&quot; style=\&quot;line;strokeWidth=1.2;dashed=1;strokeColor=#000000;direction=south;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;1042\&quot; y=\&quot;185\&quot; width=\&quot;10\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n\n        <!-- 8. ENTITY: PH\u00d2NG V\u1eacT L\u00dd TH\u1ef0C T\u1ebe (:Physical_Rooms) (X: 1220) -->\n        <mxCell id=\&quot;p_rooms\&quot; value=\&quot;&lt;&lt;Entity&gt;&gt;&#xa;:Physical_Rooms\&quot; style=\&quot;shape=umlEntity;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#000000;strokeWidth=1.5;fontFamily=Arial;fontStyle=1;fontSize=11;fontColor=#000000;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;1195\&quot; y=\&quot;120\&quot; width=\&quot;65\&quot; height=\&quot;60\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n        <mxCell id=\&quot;ll_rooms\&quot; value=\&quot;\&quot; style=\&quot;line;strokeWidth=1.2;dashed=1;strokeColor=#000000;direction=south;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;1222\&quot; y=\&quot;185\&quot; width=\&quot;10\&quot; height=\&quot;880\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n\n\n        <!-- ==================== H\u1ed8P K\u00cdCH HO\u1ea0T (ACTIVATION BARS) ==================== -->\n        <!-- L\u1ec5 t\u00e2n bar -->\n        <mxCell id=\&quot;act_rec\&quot; value=\&quot;\&quot; style=\&quot;html=1;points=[];perimeter=orthogonalPerimeter;fillColor=#FFFFFF;strokeColor=#000000;strokeWidth=1.2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;102\&quot; y=\&quot;200\&quot; width=\&quot;10\&quot; height=\&quot;830\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n\n        <!-- GanttUI bar 1 -->\n        <mxCell id=\&quot;act_gui_1\&quot; value=\&quot;\&quot; style=\&quot;html=1;points=[];perimeter=orthogonalPerimeter;fillColor=#FFFFFF;strokeColor=#000000;strokeWidth=1.2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;252\&quot; y=\&quot;205\&quot; width=\&quot;10\&quot; height=\&quot;80\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n\n        <!-- CheckInController bar -->\n        <mxCell id=\&quot;act_ctrl_1\&quot; value=\&quot;\&quot; style=\&quot;html=1;points=[];perimeter=orthogonalPerimeter;fillColor=#FFFFFF;strokeColor=#000000;strokeWidth=1.2;\&quot; vertex=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry x=\&quot;562\&quot; y=\&quot;215\&quot; width=\&quot;10\&quot; height=\&quot;780\&quot; as=\&quot;geometry\&quot; />\n        </mxCell>\n\n\n        <!-- ==================== GIAI \u0110O\u1ea0N 1: TRA C\u1ee8U \u0110\u01a0N \u0110\u1eb6T PH\u00d2NG ==================== -->\n\n        <!-- 1: L\u1ec5 t\u00e2n -> GanttUI: Tra c\u1ee9u PNR ho\u1eb7c S\u0110T -->\n        <mxCell id=\&quot;msg_1\&quot; value=\&quot;1: Tra c\u1ee9u m\u00e3 \u0111\u1eb7t ph\u00f2ng PNR&#xa;ho\u1eb7c S\u0110T c\u1ee7a kh\u00e1ch l\u01b0u tr\u00fa\&quot; style=\&quot;html=1;verticalAlign=bottom;endArrow=block;endFill=1;strokeColor=#000000;strokeWidth=1.2;fontFamily=Arial;fontSize=10;fontColor=#000000;labelBackgroundColor=#FFFFFF;fillCol    </mxCell>\n\n        <!-- 14: CheckInController -> CheckInModal: \u0110\u1ec1 xu\u1ea5t ph\u01b0\u01a1ng \u00e1n -->\n        <mxCell id=\&quot;msg_14\&quot; value=\&quot;14: - - - - \u25b6 \u0110\u1ec1 xu\u1ea5t ph\u01b0\u01a1ng \u00e1n: Y\u00eau c\u1ea7u Bu\u1ed3ng ph\u00f2ng d\u1ecdn g\u1ea5p ho\u1eb7c Th\u1ef1c hi\u1ec7n \u0110\u1ed5i h\u1ea1ng ph\u00f2ng\&quot; style=\&quot;html=1;verticalAlign=bottom;endArrow=open;endFill=0;dashed=1;strokeColor=#000000;strokeWidth=1.2;fontFamily=Arial;fontSize=10;fontColor=#000000;labelBackgroundColor=#FFFFFF;fillColor=none;align=center;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;>\n            <mxPoint x=\&quot;562\&quot; y=\&quot;825\&quot; as=\&quot;sourcePoint\&quot; />\n            <mxPoint x=\&quot;422\&quot; y=\&quot;825\&quot; as=\&quot;targetPoint\&quot; />\n          </mxGeometry>\n        </mxCell>\n\n        <!-- 15: CheckInModal -> L\u1ec5 t\u00e2n: C\u1ea3nh b\u00e1o & \u0110i\u1ec1u ph\u1ed1i (B\u1eba D\u00d2NG G\u1eccN G\u00c0NG, KH\u00d4NG TH\u00d2 SANG TR\u00c1I) -->\n        <mxCell id=\&quot;msg_15\&quot; value=\&quot;15: - - - - \u25b6 C\u1ea3nh b\u00e1o: Ph\u00f2ng ch\u01b0a s\u1eb5n s\u00e0ng \u0111\u00f3n kh\u00e1ch&#xa;Th\u00f4ng b\u00e1o L\u1ec5 t\u00e2n li\u00ean h\u1ec7 Bu\u1ed3ng ph\u00f2ng d\u1ecdn g\u1ea5p\&quot; style=\&quot;html=1;verticalAlign=bottom;endArrow=open;endFill=0;dashed=1;strokeColor=#000000;strokeWidth=1.2;fontFamily=Arial;fontSize=10;fontColor=#000000;labelBackgroundColor=#FFFFFF;fillColor=none;align=center;\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot;>\n          <mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;>\n            <mxPoint x=\&quot;412\&quot; y=\&quot;875\&quot; as=\&quot;sourcePoint\&quot; />\n            <mxPoint x=\&quot;112\&quot; y=\&quot;875\&quot; as=\&quot;targetPoint\&quot; />\n          </mxGeometry>\n        </mxCell>\n\n      </root>\n    </mxGraphModel>
